[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "big-data-analytics"
version = "0.1.0"
description = "Business analytics system for online shop data"
requires-python = ">=3.14"
dependencies = [
    "numpy",
    "pandas",
    "Faker",
    "scipy",
    "matplotlib",
    "seaborn",
    "scikit-learn",
    "keras",
    "torch",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.14",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I"]